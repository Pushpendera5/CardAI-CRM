services:
  api:
    build: .
    container_name: cardai-api
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONOPTIMIZE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./datasets:/app/datasets
      - ./trained_models:/app/trained_models
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2"

  worker:
    build: .
    container_name: cardai-worker
    restart: unless-stopped
    env_file: .env
    environment:
      PYTHONOPTIMIZE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./uploads:/app/uploads
      - ./datasets:/app/datasets
      - ./trained_models:/app/trained_models
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2

  redis:
    image: redis:7-alpine
    container_name: cardai-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cardai-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong!Passw0rd", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: cardai-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./docker/mssql-init.sql:/tmp/mssql-init.sql
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P 'YourStrong!Passw0rd' -i /tmp/mssql-init.sql"

volumes:
  mssql_data:
  redis_data:
